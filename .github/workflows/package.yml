name: package

on:
  push:
  pull_request:

jobs:
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libudev-dev
      - name: Build, test, and verify Linux package
        run: |
          ./scripts/build.sh
          ctest --test-dir build --output-on-failure
          ./scripts/verify_package_linux.sh

  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: brew install cmake ninja pkg-config
      - name: Build, test, and verify macOS package
        run: |
          ./scripts/build.sh
          ctest --test-dir build --output-on-failure
          ./scripts/verify_package_macos.sh

  windows-package:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build, test, and verify Windows package
        run: |
          ./scripts/build.sh
          ctest --test-dir build --output-on-failure
          ./scripts/verify_package_windows.sh
